<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#091711">
    <style>
      html, body { margin: 0; background: #09172b; }
      #source-boot-splash { position: fixed; z-index: 9999; inset: 0; display: grid; place-content: center;
        gap: 8px; color: #fff4d7; background: radial-gradient(circle at 50% 35%, #23476d, #09172b 72%);
        text-align: center; font: 700 14px system-ui, sans-serif; }
      #source-boot-splash strong { color: #ffe5a3; font-size: 25px; }
      #source-boot-splash span { color: #c8d8e5; font-size: 12px; }
      #source-boot-retry { margin: 10px auto 0; padding: 9px 16px; border: 1px solid #ffe5a3;
        border-radius: 8px; color: #09172b; background: #ffe5a3; cursor: pointer; font-weight: 800; }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Pokemon Z-Battle — Overworld Sandbox</title>
  </head>
  <body>
    <div id="source-boot-splash" role="status"><strong>Pokémon Z</strong><span>Chargement de l’aventure…</span>
      <button id="source-boot-retry" type="button" hidden>Réessayer</button></div>
    <div id="app"></div>
    <script>
      window.setTimeout(() => {
        const splash = document.getElementById("source-boot-splash");
        if (splash === null) return;
        splash.querySelector("span").textContent = "Le chargement prend trop de temps. Vérifiez que le serveur local fonctionne, puis réessayez.";
        const retry = document.getElementById("source-boot-retry");
        retry.hidden = false;
        retry.addEventListener("click", () => location.reload(), { once: true });
      }, 20000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
