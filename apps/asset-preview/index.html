<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokemon Z-Battle — Asset Lab</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#ecf4ff;background:radial-gradient(circle at 12% 8%,#243b63 0,#101827 34%,#080d16 76%)}header{padding:42px clamp(20px,6vw,88px) 24px;border-bottom:1px solid #ffffff18}h1{margin:0;font-size:clamp(32px,5vw,68px);letter-spacing:-.055em}h1 span,#title code{color:#72e6b1}header p{max-width:760px;color:#a9bad1;line-height:1.6}main{padding:26px clamp(20px,6vw,88px) 60px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:18px;background:#101b2bd9;border:1px solid #ffffff18;border-radius:18px;box-shadow:0 18px 70px #0008}label{display:grid;gap:8px;color:#9eb1ca;font-size:13px}input,select,button{width:100%;min-height:42px;border:1px solid #ffffff24;border-radius:10px;padding:9px 12px;color:#ecf4ff;background:#0a121f}button{cursor:pointer;color:#07150f;background:#72e6b1;border-color:transparent;font-weight:750}#status{margin:16px 2px 22px;color:#93a7c1}#title{display:flex;align-items:baseline;gap:12px;margin:30px 0 16px}#title h2{margin:0;font-size:30px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}article{min-height:250px;padding:14px;overflow:hidden;border:1px solid #ffffff17;border-radius:16px;background:linear-gradient(145deg,#152338dd,#0c1421ee)}.visual{display:grid;place-items:center;height:158px;margin-bottom:12px;border-radius:11px;background:repeating-conic-gradient(#ffffff09 0 25%,transparent 0 50%) 0/18px 18px}img,canvas{max-width:100%;max-height:150px;image-rendering:pixelated;object-fit:contain}article h3{margin:0 0 8px;font-size:15px}article p{margin:4px 0;color:#91a5be;font-size:12px;overflow-wrap:anywhere}.empty{grid-column:1/-1;padding:38px;color:#91a5be;text-align:center;border:1px dashed #ffffff24;border-radius:16px}
  </style>
</head>
<body>
  <header><h1>Asset <span>Lab</span></h1><p>Inspection locale des variantes Pokémon. Le chargement sécurisé est partagé avec le Battle Sandbox et les fichiers ne quittent jamais votre machine.</p></header>
  <main><section class="controls">
    <label>Manifestes JSON<input id="manifests" type="file" accept="application/json,.json" multiple></label>
    <label>Dossier du jeu<button id="folder" type="button">Choisir le dossier source</button></label>
    <label>ID Pokémon<input id="pokemonId" type="number" min="1" max="1018" value="25"></label>
    <label>Famille<select id="kind"><option value="all">Toutes</option><option>battler</option><option>icon</option><option>footprint</option><option>overworld</option><option>cry</option></select></label>
  </section><p id="status">Chargez les deux manifestes, puis choisissez le dossier du jeu.</p><div id="title"></div><section id="grid"><div class="empty">En attente des données locales.</div></section></main>
  <script type="module" src="/src/main.ts"></script>
</body></html>
